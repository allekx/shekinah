# ============================================================
# SHEKINAH — Configuração do Supabase CLI (local)
#
# Sem credenciais secretas. Aponte para o projeto real com:
#   supabase link --project-ref <REF>
# Depois envie as migrations com:
#   supabase db push
# ============================================================

project_id = "shekinah"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/*"]

[auth.email]
enable_signup = false

[realtime]
enabled = true
